services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.40@sha256:52194fba4fecd0083c842158b3a902ba6e04a63619b2b0efcd08007bdb6a4602
    command: "mini -s3.port=9000"
    expose:
      - "9000"
    environment:
      AWS_ACCESS_KEY_ID: some_key
      AWS_SECRET_ACCESS_KEY: some_key
      S3_BUCKET: gpyezzey,gpyezzey2,gpyezzey3
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9333/cluster/status && wget -S --spider http://127.0.0.1:9000 2>&1 | grep -q 'HTTP/1.1'"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    hostname: seaweedfs

  yezzey:
    image: yezzey
    build:
      context: ../..
      dockerfile: docker/yezzey/Dockerfile
      args:
        accessKeyId: some_key
        secretAccessKey: some_key
        bucketName: gpyezzey
        s3endpoint: "http:\\/\\/seaweedfs:9000"
        yezzeyRef: ${YEZZEY_GITHUB_REF:-v1.8_opengpdb}
    depends_on:
      seaweedfs:
        condition: service_healthy

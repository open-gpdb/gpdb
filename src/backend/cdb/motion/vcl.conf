# VPP VCL configuration for Greenplum UDP interconnect kernel bypass.
#
# Place this file at /etc/vpp/vcl.conf or set VCL_CONFIG=<path>
# in the environment before starting Greenplum.
#
# Requires VPP to be running with a UDP transport and session layer
# enabled (startup.conf must include: session { evt_qs_memfd_seg } ).

vcl {
  # All backends register as workers of the same application
  app-name greenplum

  # Global scope: packets go through VPP dataplane (required for
  # inter-host communication)
  app-scope-global

  # Use eventfd for message-queue notifications (avoids busy-poll)
  use-mq-eventfd

  # FIFO sizes — must accommodate Gp_max_packet_size (default 8KB)
  # plus session_dgram_hdr_t overhead.  128KB provides headroom for
  # multiple in-flight datagrams per session.
  rx-fifo-size 128K
  tx-fifo-size 128K

  # Segment memory for FIFO allocation.
  # 256MB initial, grows in 128MB increments.
  # With 200 backends × 2 sockets × 2 FIFOs × 128KB ≈ 100MB.
  segment-size 256M
  add-segment-size 128M
}
